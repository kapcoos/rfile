[package]
name = "rfile"
version = "0.1.2"
edition = "2024"
authors = ["kapcos"]
description = "A fast, single-shot CLI file and directory inspector"
license = "MIT"
repository = "https://github.com/kapcoos/rfile"
readme = "README.md"
keywords = ["cli", "file", "inspector", "metadata", "utility"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
walkdir = "2.5.0"
infer = "0.22.0"
filetime = "0.2.29"
bytesize = "2.7.0"
chrono = "0.4.45"
